# Example: 5-Host Home/Office LAN P2P Mesh with mDNS Discovery

[node]
node_id = "desktop-win"
hostname = "desktop-win"
tags = ["windows", "workstation", "gpu"]

[network]
topology = "p2p-mesh"
role = "peer"
listen_address = "0.0.0.0"
listen_port = 47890
enable_mdns_discovery = true
multicast_group = "239.255.77.89"
discovery_port = 47891
# Replace with 64-hex shared key generated by `ag-mesh keygen --psk`
cluster_psk_hex = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
heartbeat_interval_ms = 3000
peer_timeout_ms = 12000
zstd_threshold_bytes = 512
zstd_level = 3
bandwidth_limit_kbps = 0
max_attachment_bytes = 8388608

[privacy]
metadata_only = false
sanitize_secrets = true
entropy_threshold = 4.5
entropy_min_length = 20
full_text_ttl_days = 30
allow_globs = ["**/projects/**", "**/workspace/**"]
deny_globs = ["**/.env*", "**/secrets/**", "**/.ssh/**"]

[mcp]
enable_http = true
bind_address = "127.0.0.1"
port = 47895
enable_metrics = true

[antigravity]
watcher_debounce_ms = 350
poll_interval_ms = 5000

[logging]
level = "info"
json_format = false

# Authorized peers in the 5-host LAN cluster (copy each node's fingerprint from `ag-mesh keygen`)
[[peers]]
node_id = "laptop-linux"
address = "192.168.1.21"
port = 47890
pubkey_fingerprint = "REPLACE_WITH_SHA256_FINGERPRINT_LAPTOP_LINUX"

[[peers]]
node_id = "macbook-arm64"
address = "192.168.1.22"
port = 47890
pubkey_fingerprint = "REPLACE_WITH_SHA256_FINGERPRINT_MACBOOK"

[[peers]]
node_id = "home-server"
address = "192.168.1.10"
port = 47890
pubkey_fingerprint = "REPLACE_WITH_SHA256_FINGERPRINT_HOME_SERVER"

[[peers]]
node_id = "mini-pc-lab"
address = "192.168.1.35"
port = 47890
pubkey_fingerprint = "REPLACE_WITH_SHA256_FINGERPRINT_MINI_PC"
